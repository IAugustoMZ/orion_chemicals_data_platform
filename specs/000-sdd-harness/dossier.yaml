rationale: 'Every later feature is built, approved and taught through this harness: the lifecycle, the
  gates G0-G7 approved by both of us, the sdd tool that enforces them locally, the agent adapters and
  the documentation standard. It supports RT36 (no credentials: secret scanning and the agent guard),
  RT38 (audit: approvals record actor, time, digest and note) and RT42 (automated validation before publication:
  gate G5 and pre-commit) without delivering them for platform data.'
