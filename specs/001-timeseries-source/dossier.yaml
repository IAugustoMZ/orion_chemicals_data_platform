rationale: The platform team has no plant to connect to. The simulated plant data of five sites in different
  time zones must get time right (UTC, original representation, ambiguity flagged, three timestamps),
  because a wrong rule would poison every later test. This is the first dossier of the time-series source;
  the rest of the original need moved to the dossiers of roadmap.md (specs are one file of at most 50
  lines).
