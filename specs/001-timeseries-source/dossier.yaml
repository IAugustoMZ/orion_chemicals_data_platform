rationale: The platform team has no plant to connect to. This continuous source gives it simulated, labelled
  and deliberately messy plant time-series from five sites in different time zones, so identity, time,
  late-data and scale requirements can be built and tested before any ingestion exists, and so a future
  contextualisation model has training data while the plant structure stays hidden in an answer key.
