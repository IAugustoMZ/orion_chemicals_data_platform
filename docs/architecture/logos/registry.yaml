    url: https://cdn.simpleicons.org/apacheparquet/50ABF1
  - name: DuckDB
    url: https://cdn.simpleicons.org/duckdb/FFF000
  - name: Prefect
    url: https://cdn.simpleicons.org/prefect/024DFD
  - name: Redis
